[project]
name = "painel-propagandas"
version = "2.0.0"
description = "Sinalização digital para estabelecimentos comerciais"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# Regras fixas: o resultado não muda quando sai uma versão nova do ruff.
select = ["E4", "E7", "E9", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["propagandas", "src", "conftest"]

[tool.mypy]
# Tipagem conferida no código novo (src/). O pacote antigo (propagandas) entra conforme for migrado.
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "segno.*", "waitress.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
