{% extends "base.html" %}
{% block cabeca %}<link rel="stylesheet" href="{{ url_for('static', filename='comanda.css') }}">
<script defer src="{{ url_for('static', filename='comanda.js') }}"></script>{% endblock %}
{% block titulo %}Ajustes da Comanda{% endblock %}
{% block classe_main %}medio{% endblock %}
{% block conteudo %}
<section>
  <h2>Ajustes da Comanda</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo"><label>Nome no cupom</label><input type="text" name="nome_estabelecimento" maxlength="80" value="{{ nome_estabelecimento }}"></div>
    <div class="campo"><label>Endereço / telefone (no cupom)</label><input type="text" name="endereco" maxlength="160" value="{{ endereco }}"></div>
    <div class="campo"><label>Mensagem no fim do cupom</label><input type="text" name="rodape_cupom" maxlength="160" value="{{ rodape_cupom }}"></div>
    <div class="campo"><label>Taxa de serviço (%)</label><input type="text" name="taxa_servico" inputmode="decimal" value="{{ taxa_servico }}" class="u-max120"></div>
    <button type="submit">Salvar</button>
  </form>
</section>
{% endblock %}
